name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forthekids
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forthekids
      JWT_SECRET: secreto-solo-para-ci
      REMINDERS_ENABLED: 'false'
      ADMIN_CORREO: admin.ci@ejemplo.test
      ADMIN_PASSWORD: AdminCi2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:init
      - run: npm run db:migrate
      - run: npm run test:cobertura
      - run: npm run build
